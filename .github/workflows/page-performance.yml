name: Page performance

on:
  workflow_dispatch:
    inputs:
      source:
        description: Sitemap to use
        type: choice
        default: production
        options:
          - production
          - fixture
  schedule:
    - cron: '0 8 * * 1'
  push:
    paths:
      - 'config/performance.json'
      - 'config/performance.exlm.example.json'
      - 'src/**'
      - 'fixtures/**'
      - '.github/workflows/page-performance.yml'

concurrency:
  group: page-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PERF_CONFIG: ${{ github.event_name == 'push' && 'config/performance.json' || (github.event.inputs.source == 'fixture' && 'config/performance.json' || 'config/performance.exlm.example.json') }}

jobs:
  discover:
    name: Discover URLs from sitemap
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      retention: ${{ steps.plan.outputs.retention }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover
        run: node src/discover.mjs
      - id: plan
        name: Export shard matrix
        run: |
          echo "shards=$(jq -c '.shardIndexes' performance-reports/plan.json)" >> "$GITHUB_OUTPUT"
          echo "retention=$(jq -r '.artifactRetentionDays' performance-reports/plan.json)" >> "$GITHUB_OUTPUT"
          echo "Selected $(jq -r '.urlCount' performance-reports/plan.json) URLs from $(jq -r '.discoveredCount' performance-reports/plan.json) sitemap locs"
          jq -r '.selectedByType[]? | "\(.id)\t\(.url)"' performance-reports/plan.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: page-performance-plan
          path: performance-reports/
          retention-days: ${{ fromJSON(steps.plan.outputs.retention) }}
          if-no-files-found: error

  audit:
    name: Audit shard ${{ matrix.shard }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.discover.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome
        id: chrome
        if: github.event_name != 'push' && github.event.inputs.source != 'fixture'
        uses: browser-actions/setup-chrome@v2
      - name: Install Lighthouse when configured
        run: |
          if [ "$(jq -r '.auditor' "${PERF_CONFIG}")" = "lighthouse" ]; then
            npm install lighthouse@^12 --no-save
          fi
      - uses: actions/download-artifact@v4
        with:
          name: page-performance-plan
          path: performance-reports
      - name: Audit
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node src/audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: page-performance-shard-${{ matrix.shard }}
          path: performance-reports/shards/${{ matrix.shard }}/
          retention-days: ${{ fromJSON(needs.discover.outputs.retention) }}
          if-no-files-found: error

  summarize:
    name: Summarize
    needs: [discover, audit]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: page-performance-*
          path: _artifacts
          merge-multiple: false
      - name: Rebuild report tree
        run: |
          mkdir -p performance-reports/shards
          cp -R _artifacts/page-performance-plan/. performance-reports/
          for d in _artifacts/page-performance-shard-*; do
            [ -d "$d" ] || continue
            idx="${d##*-}"
            mkdir -p "performance-reports/shards/${idx}"
            cp -R "$d"/. "performance-reports/shards/${idx}/"
          done
          node src/summarize.mjs
          cat performance-reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: page-performance-summary
          path: |
            performance-reports/summary.md
            performance-reports/summary.json
            performance-reports/plan.json
          retention-days: ${{ fromJSON(needs.discover.outputs.retention) }}

  cleanup:
    name: Delete old artifacts
    needs: summarize
    if: always() && needs.summarize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep last N runs, delete the rest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/cleanup.mjs
